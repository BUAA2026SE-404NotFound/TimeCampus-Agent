[project]
name = "timecampus-agent"
version = "0.1.0"
description = "Standalone LangChain agents for TimeCampus maintenance and guide workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=0.3.27,<0.4",
    "langchain-openai>=0.3.28,<0.4",
    "pydantic>=2.11.7,<3",
    "python-dotenv>=1.1.1,<2",
    "rich>=14.1.0,<15",
]

[project.scripts]
timecampus-agent = "timecampus_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "ruff>=0.12.8,<0.13",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
