[project]
name = "timecampus-agent"
version = "0.3.0-beta"
description = "Standalone LangChain agents for TimeCampus maintenance and guide workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.1",
    "langchain>=1.1.0,<2",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.2.1,<1",
    "langgraph>=1.2.5,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic>=2.11.7,<3",
    "python-dotenv>=1.1.1,<2",
    "rich>=14.1.0,<15",
    "uvicorn>=0.35.0,<1",
]

[project.scripts]
timecampus-agent = "timecampus_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.12.8,<0.13",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
