name: TimeCampus Agent CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "codex/**"
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the tested wheel to the production host"
        required: false
        default: false
        type: boolean
      run_live_eval:
        description: "Run production RAG benchmark and end-to-end RAG eval"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

      - name: Fixture eval gate
        run: uv run timecampus-agent eval run --suite all --mode fixture --repetitions 2 --report-dir eval-reports --min-pass-rate 0.85 --min-overall 80 --min-consistency 0.80

      - name: Build wheel
        run: uv build

      - name: Prepare release artifact
        run: |
          mkdir release
          cp dist/*.whl deploy/deploy-agent-artifact.sh deploy/timecampus-agent.service release/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: timecampus-agent-${{ github.sha }}
          path: release/
          if-no-files-found: error

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    env:
      SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
      SERVER_USERNAME: ${{ secrets.DEPLOY_USERNAME || secrets.DEPLOY_USER }}
      SERVER_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: timecampus-agent-${{ github.sha }}
          path: release

      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          password: ${{ env.SERVER_PASSWORD }}
          source: "release/*"
          target: "/home/${{ env.SERVER_USERNAME }}/timecampus-agent/incoming/${{ github.sha }}"
          strip_components: 1

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          password: ${{ env.SERVER_PASSWORD }}
          script: |
            set -euo pipefail
            INCOMING="$HOME/timecampus-agent/incoming/${{ github.sha }}"
            chmod +x "$INCOMING/deploy-agent-artifact.sh"
            "$INCOMING/deploy-agent-artifact.sh" "$INCOMING/"*.whl "${{ github.sha }}"

  live-eval:
    needs:
      - test
      - deploy
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.run_live_eval &&
        needs.test.result == 'success' &&
        (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
      }}
    env:
      SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
      SERVER_USERNAME: ${{ secrets.DEPLOY_USERNAME || secrets.DEPLOY_USER }}
      SERVER_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

    steps:
      - name: Run live RAG quality gate
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USERNAME }}
          password: ${{ env.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            ENV_FILE="$HOME/TimeCampus/.env"
            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d%H%M%S)"
            if grep -q '^TIMECAMPUS_EVAL_LLM_ENABLED=' "$ENV_FILE"; then
              sed -i 's/^TIMECAMPUS_EVAL_LLM_ENABLED=.*/TIMECAMPUS_EVAL_LLM_ENABLED=true/' "$ENV_FILE"
            else
              printf '\nTIMECAMPUS_EVAL_LLM_ENABLED=true\n' >> "$ENV_FILE"
            fi
            sudo systemctl restart timecampus-agent
            for _ in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8090/health >/dev/null && break
              sleep 1
            done

            TIMECAMPUS_AGENT_API_TOKEN="$(
              sed -n 's/^TIMECAMPUS_AGENT_API_TOKEN=//p' "$ENV_FILE" |
                tail -n 1 |
                tr -d '\r'
            )"
            test -n "$TIMECAMPUS_AGENT_API_TOKEN"
            PYTHON="$HOME/timecampus-agent/current/.venv/bin/python"
            REPORT_DIR="$HOME/timecampus-agent/shared/eval-reports"

            run_eval() {
              local tag="$1"
              local repetitions="$2"
              local output="$REPORT_DIR/remote-$tag.json"
              local payload
              payload="$("$PYTHON" - "$tag" "$repetitions" <<'PY'
            import json
            import sys
            from timecampus_agent.evaluation.cases import load_eval_cases

            tag, repetitions = sys.argv[1], int(sys.argv[2])
            cases = load_eval_cases("maintenance")
            if tag == "rag-benchmark":
                ids = [case.id for case in cases if tag in case.tags]
            else:
                ids = [case.id for case in cases if case.expected.get("llmJudge")]
            print(json.dumps({
                "suite": "maintenance",
                "mode": "live",
                "repetitions": repetitions,
                "caseIds": ids,
            }))
            PY
              )"
              curl -fsS \
                -H "Content-Type: application/json" \
                -H "X-TimeCampus-Agent-Token: $TIMECAMPUS_AGENT_API_TOKEN" \
                -d "$payload" \
                http://127.0.0.1:8090/internal/v1/evals/runs \
                > "$output"
              "$PYTHON" - "$output" <<'PY'
            import json
            import sys

            result = json.load(open(sys.argv[1], encoding="utf-8"))
            print(json.dumps({
                "runId": result["runId"],
                "total": result["total"],
                "passed": result["passed"],
                "passRate": result["passRate"],
                "averageOverall": result["averageOverall"],
                "metricAverages": result["metricAverages"],
                "p50LatencyMs": result["p50LatencyMs"],
                "p95LatencyMs": result["p95LatencyMs"],
                "gatePassed": result["gatePassed"],
                "failures": [{
                    "caseId": item["caseId"],
                    "attempt": item["attempt"],
                    "metrics": item["metrics"],
                    "reasons": item["failureReasons"],
                    "topUris": [
                        doc["uri"]
                        for doc in item["trace"].get("retrievedDocs", [])[:3]
                    ],
                } for item in result["results"] if not item["passed"]],
            }, ensure_ascii=False))
            PY
            }

            run_eval rag-benchmark 5
            run_eval rag-e2e 3
